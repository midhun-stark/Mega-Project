<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sentimate – Settings</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body onload="checkAuth(); loadSettings();">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="dashboard.html">Dashboard</a>
    <a href="medicines.html">Medicines</a>
    <a href="family.html">Family</a>
    <a href="settings.html" class="active">Settings</a>
  </nav>

  <div class="container">

    <h2>Settings</h2>
    <p class="subtitle">Comfort & preferences</p>

    <!-- ACCESSIBILITY -->
    <div class="card">
      <h3>Accessibility</h3>
      <p>Text Size</p>
      <div class="option-row">
        <button onclick="setTextSize('small')">Small</button>
        <button onclick="setTextSize('medium')">Medium</button>
        <button onclick="setTextSize('large')">Large</button>
      </div>
    </div>

    <!-- SOUND -->
    <div class="card">
      <h3>Sound</h3>
      <div class="option-row">
        <button onclick="setSound(true)">ON</button>
        <button onclick="setSound(false)">OFF</button>
      </div>
    </div>

    <!-- APPEARANCE -->
    <div class="card">
      <h3>Appearance</h3>
      <p>Comfort Mode</p>
      <div class="option-row">
        <button onclick="setTheme('normal')">Normal</button>
        <button onclick="setTheme('warm')">Extra Warm</button>
      </div>
    </div>

    <!-- LANGUAGE -->
    <div class="card">
      <h3>Language</h3>
      <p>English</p>
      <p class="subtitle">More languages coming soon</p>
    </div>

    <!-- ACCOUNT -->
    <div class="card">
      <h3>Account</h3>
      <button class="danger" onclick="logout()">Logout</button>
    </div>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
