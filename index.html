<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentimate – Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="centered">

  <div class="card login-card">
    <h1>Sentimate</h1>
    <p class="subtitle">Welcome back</p>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <p style="margin-top:10px;">Login as:</p>
    <div class="option-row">
      <button onclick="login('elder')">👴 Elder</button>
      <button onclick="login('family')">👨‍👩‍👧 Family</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
