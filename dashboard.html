<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentimate – Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body onload="checkAuth(); loadSettings(); loadDashboard();">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="medicines.html">Medicines</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="container">

    <h2 id="greeting">Good Day</h2>
    <p class="subtitle">Today’s overview</p>

    <!-- STATUS CARD -->
    <div class="card">
      <h3>Status</h3>
      <p>🟢 Active • 😊 Calm</p>
    </div>

    <!-- WEEKLY SUMMARY -->
    <div class="card">
      <h3>📊 Weekly Adherence</h3>
      <p id="weeklyTaken">Taken: 0</p>
      <p id="weeklyMissed">Missed: 0</p>
      <p id="weeklyPercent"><strong>Adherence: 0%</strong></p>
    </div>

    <button onclick="logout()" class="danger">Logout</button>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
