<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentimate – Medicines</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body onload="checkAuth(); checkRole('elder'); loadSettings(); loadMedicines();">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="dashboard.html">Dashboard</a>
    <a href="medicines.html" class="active">Medicines</a>
    <a href="settings.html">Settings</a>
  </nav>

  <div class="container">

    <h2>Medicines</h2>
    <p class="subtitle">Today’s medicines</p>

    <!-- ADD MEDICINE (FAMILY ONLY, hidden for elder) -->
    <div class="card" id="addMedCard" style="display:none;">
      <h3>Add Medicine</h3>
      <input id="medName" type="text" placeholder="Medicine name">
      <input id="medTime" type="time">
      <button onclick="addMedicine()">Add</button>
    </div>

    <!-- MEDICINE LIST -->
    <div id="medicineList"></div>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/medicines.js"></script>
</body>
</html>
